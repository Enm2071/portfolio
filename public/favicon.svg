<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <!-- Brand favicon: matches Navbar.astro's logo mark (lucide "Code2") in
         the site's own gradient tokens (Layout.astro's primary blue #3b82f6
         through purple #a855f7 theme variables), on the same dark charcoal
         background color the whole site uses. Replaces Astro's stock
         default rocket-mark favicon, which had no relation to the brand. -->
    <defs>
        <linearGradient id="brand-gradient" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="100%" stop-color="#a855f7" />
        </linearGradient>
    </defs>
    <rect width="24" height="24" rx="6" fill="#111418" />
    <g fill="none" stroke="url(#brand-gradient)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 8 3 4-3 4" />
        <path d="m9 8-3 4 3 4" />
        <path d="m13 6-2 12" />
    </g>
</svg>
